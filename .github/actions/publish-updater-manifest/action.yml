name: Publish updater manifest
description: >-
  Rebuild latest.json from the release's own signature assets and publish it.
  Safe to run from either release workflow, in any order, concurrently.

inputs:
  version:
    description: Release version without the leading v, for example 1.5.3
    required: true
  tag-name:
    description: Release tag, for example v1.5.3
    required: true
  github-token:
    description: Token used to read and write release assets
    required: true

runs:
  using: composite
  steps:
    - name: Publish updater manifest
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # The calling job checks the repository out so this action can be found
        # and `.github/scripts/updater-manifest.mjs` read. Composite steps get no
        # working tree of their own, so name the repository explicitly rather
        # than letting gh infer it from a git remote that may not be there.
        GH_REPO: ${{ github.repository }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
        TAG_NAME: ${{ inputs.tag-name }}
      run: |
        set -euo pipefail

        # Both independent builders may still be uploading. Wait at most 40
        # minutes without publishing any partial updater manifest. API errors
        # and malformed identity fail immediately; only missing assets retry.
        for attempt in $(seq 1 40); do
          gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" --jq '.assets' > release-assets.json
          ready=0
          RELEASE_ASSETS=release-assets.json node .github/scripts/updater-manifest.mjs --check-assets || ready=$?
          if [ "$ready" -eq 0 ]; then break; fi
          if [ "$ready" -ne 2 ] || [ "$attempt" -eq 40 ]; then
            echo "::error::Complete updater assets are unavailable; latest.json was not uploaded."
            exit 1
          fi
          sleep 60
        done

        mkdir signatures
        gh release download "$TAG_NAME" --pattern '*.sig' --dir signatures
        # Use the immutable release creation date across both publishers.
        gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" --jq '{version: .tag_name, pub_date: .created_at}' > release-date.json
        RELEASE_ASSETS=release-assets.json PUBLISHED_MANIFEST=release-date.json \
          node .github/scripts/updater-manifest.mjs
        gh release upload "$TAG_NAME" latest.json --clobber
        mkdir verify
        gh release download "$TAG_NAME" --pattern latest.json --dir verify
        jq -e -n --slurpfile expected latest.json --slurpfile actual verify/latest.json \
          '$expected[0].version == $actual[0].version and $expected[0].platforms == $actual[0].platforms' > /dev/null
        {
          echo "### Complete updater manifest"
          jq -r '.platforms | keys[] | "- `\(.)`"' verify/latest.json
        } >> "$GITHUB_STEP_SUMMARY"
