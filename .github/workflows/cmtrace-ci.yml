name: "CMTrace Open: CI"

on:
  push:
    branches: [main, codex/parser-family-skeleton]
  pull_request:
    # Long-lived integration branches must be listed explicitly: a PR whose base
    # is absent here runs no jobs at all, silently, and still reports mergeable.
    branches: [main, codex/parser-family-skeleton]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          # Cargo.lock moved to the workspace root when src-tauri became a
          # member of the cmtraceopen Cargo workspace; cache key follows.
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust check (lite)
        working-directory: src-tauri
        run: cargo check --no-default-features

      - name: Rust tests (lite)
        working-directory: src-tauri
        run: cargo test --no-default-features

      - name: Rust clippy (lite)
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Every step above runs with working-directory: src-tauri, which selects
      # only the cmtrace-open package. The parser crate's own test targets were
      # therefore never built or run here, and its source was never linted: the
      # sole parser test in CI was the Windows-only `--test esp_diagnostics` job.
      # These two steps close that gap once, so each workload leaf added under
      # epic #356 is gated without touching this workflow.
      - name: Parser crate tests
        run: cargo test --locked -p cmtraceopen-parser

      - name: Parser crate clippy
        run: cargo clippy --locked -p cmtraceopen-parser --all-targets -- -D warnings

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny,cargo-audit

      - name: Supply chain audit (licenses & bans)
        working-directory: src-tauri
        run: cargo deny check

      - name: Security vulnerability audit
        # cargo-audit reads Cargo.lock from the current directory (no
        # workspace walk); run from the repo root where the lockfile now
        # lives. Covers the full workspace: src-tauri + cmtraceopen-parser.
        run: cargo audit

  msrv:
    name: Rust MSRV (1.88 / ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-msrv-1.88-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-1.88-

      - name: Rust MSRV check
        run: cargo +1.88 check --workspace --all-features --locked

  frontend:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm run test

      - name: CI bundle output contract tests
        run: node --test scripts/ci-bundle-outputs.test.mjs scripts/ci-windows-provenance.test.mjs

      # Release-workflow helpers. nightly-channel.test.mjs existed but was wired
      # into nothing, so it had never guarded a pull request.
      - name: Release script tests
        run: node --test .github/scripts/updater-manifest.test.mjs .github/scripts/nightly-channel.test.mjs .github/scripts/installer-policy.test.mjs

      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keyed on the resolved @playwright/test version so a bump busts the cache
      # rather than running against browsers built for a different client.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser binaries but not the apt packages they
      # link against, so the system dependencies are always ensured.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts starts the Vite dev server itself and the Tauri IPC
      # shim mocks the backend, so no Rust build is needed here.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  windows-esp:
    name: ESP Diagnostics (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-esp-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-esp-cargo-

      # Run all parser-crate targets on Windows in addition to the Linux checks.
      - name: Test parser crate contracts
        run: cargo test --locked -p cmtraceopen-parser

      - name: Clippy parser crate
        run: cargo clippy --locked -p cmtraceopen-parser --all-targets -- -D warnings

      - name: Test native ESP diagnostics
        run: cargo test --locked -p cmtrace-open --all-features --test esp_diagnostics_sources

      - name: Test Graph ESP diagnostics
        run: cargo test --locked -p cmtrace-open --all-features --test graph_esp_diagnostics

      - name: Test full Windows application workspace
        run: cargo test --locked -p cmtrace-open --all-features

      - name: Clippy Windows ESP paths
        run: cargo clippy --locked -p cmtrace-open --all-targets --all-features -- -D warnings
  build:
    name: Build (${{ matrix.label }})
    needs: [check, frontend, windows-esp]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Remove cached bundle outputs
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
        run: node scripts/ci-bundle-outputs.mjs clean

      - name: Install frontend dependencies
        run: npm ci

      - name: Disable updater signing for CI builds
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (c.bundle) c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}

      - name: Verify current-version bundle outputs
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
        run: node scripts/ci-bundle-outputs.mjs verify

      - name: Record Windows build provenance
        if: runner.os == 'Windows'
        env:
          RELEASE_ROOT: src-tauri/target/${{ matrix.target }}/release
          TARGET_TRIPLE: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-windows-provenance.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmtrace-open-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/provenance/windows-build-provenance.json
          if-no-files-found: warn
