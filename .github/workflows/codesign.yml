name: "CMTrace Open: Windows Signed Release"

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "!*.*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 0.1.1 or v0.1.1)
        required: true
        type: string

permissions: {}

jobs:
  prepare-windows-release:
    name: Prepare Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve_version.outputs.version }}
      tag_name: ${{ steps.resolve_version.outputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release version
        id: resolve_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVersion = "${{ inputs.version }}"
          } else {
            $rawVersion = "${{ github.ref_name }}"
          }

          $normalizedVersion = $rawVersion.Trim()
          if ($normalizedVersion.StartsWith("v")) {
            $normalizedVersion = $normalizedVersion.Substring(1)
          }

          if (-not $normalizedVersion) {
            throw "Could not determine a release version."
          }

          $tagName = "v$normalizedVersion"

          "version=$normalizedVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate version consistency
        shell: pwsh
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = $null
          $inPackageSection = $false
          foreach ($line in Get-Content src-tauri/Cargo.toml) {
            if ($line -match '^\[package\]\s*$') {
              $inPackageSection = $true
              continue
            }

            if ($inPackageSection -and $line -match '^\[') {
              break
            }

            if ($inPackageSection -and $line -match '^version\s*=\s*"([^"]+)"\s*$') {
              $cargoVersion = $Matches[1]
              break
            }
          }

          $versions = @{
            package = $packageVersion
            tauri = $tauriVersion
            cargo = $cargoVersion
            workflow = $env:VERSION
          }

          $mismatches = $versions.GetEnumerator() | Where-Object { $_.Value -ne $env:VERSION }
          if ($mismatches) {
            $details = ($versions.GetEnumerator() | ForEach-Object { "{0}={1}" -f $_.Key, $_.Value }) -join ", "
            throw "Version mismatch detected: $details"
          }

      - name: Create release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve_version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          $tagExists = git rev-parse --verify --quiet "refs/tags/$env:TAG_NAME"
          if (-not $tagExists) {
            git tag $env:TAG_NAME
            git push origin $env:TAG_NAME
          }

      - name: Ensure GitHub release exists
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve_version.outputs.tag_name }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          $releaseTitle = "CMTrace Open $env:TAG_NAME"

          $releaseExists = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            gh release view $env:TAG_NAME *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseExists = $true
              break
            }

            Start-Sleep -Seconds 10
          }

          if (-not $releaseExists) {
            # Shared with cmtrace-release.yml so that whichever half of the
            # release gets there first seeds the same notes, including the
            # cmtrace.net download shortlinks.
            $templatePath = ".github/release-notes/template.md"
            if (-not (Test-Path $templatePath)) {
              throw "Release notes template not found at $templatePath."
            }

            $releaseNotes = Get-Content $templatePath -Raw
            $releaseNotes = $releaseNotes.Replace("{{TAG}}", $env:TAG_NAME)
            $releaseNotes = $releaseNotes.Replace("{{VERSION}}", $env:VERSION)
            Set-Content -Path release-notes.md -Value $releaseNotes -Encoding utf8

            gh release create $env:TAG_NAME --draft --title $releaseTitle --notes-file release-notes.md *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release view $env:TAG_NAME *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "GitHub release $env:TAG_NAME was not available and could not be created."
              }
            }
          }

  windows-signed-release:
    name: Signed Windows Release (${{ matrix.label }})
    needs: prepare-windows-release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: codesigning
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows-x64
            rust_target: x86_64-pc-windows-msvc
            artifact_suffix: x64
          - label: Windows-arm64
            rust_target: aarch64-pc-windows-msvc
            artifact_suffix: arm64

    env:
      VERSION: ${{ needs.prepare-windows-release.outputs.version }}
      TAG_NAME: ${{ needs.prepare-windows-release.outputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      # ── Build full edition + NSIS installer ──
      # Tauri patches the binary with bundle-type metadata during bundling,
      # so the NSIS installer must be built in the same step as the binary.
      - name: Build full edition (NSIS + standalone EXE)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build:release -- --target ${{ matrix.rust_target }} --bundles nsis

      # Save the full binary before lite build overwrites it
      # (both builds produce cmtrace-open.exe in the same release dir)
      - name: Save full edition binary
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "src-tauri\target\${{ matrix.rust_target }}\release"
          Copy-Item (Join-Path $releaseDir "cmtrace-open.exe") (Join-Path $PWD "full-edition.exe") -Force

      # ── Build lite edition (no bundle, overwrites cmtrace-open.exe) ──
      - name: Build lite edition (standalone EXE)
        run: npx tauri build --target ${{ matrix.rust_target }} --no-bundle --config src-tauri/tauri.lite.conf.json -- --no-default-features

      # ── Stage all release artifacts ──
      - name: Stage release artifacts
        id: stage_artifacts
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "src-tauri\target\${{ matrix.rust_target }}\release"
          $bundleNsisDir = Join-Path $releaseDir "bundle\nsis"
          $artifactDir = Join-Path $PWD "release-artifacts"

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          # Full EXE from saved copy (before lite build overwrote it)
          $stagedFullExe = Join-Path $artifactDir "CMTrace-Open_$($env:VERSION)_${{ matrix.artifact_suffix }}.exe"
          Copy-Item (Join-Path $PWD "full-edition.exe") $stagedFullExe -Force

          # Lite EXE from release dir (current cmtrace-open.exe is the lite build)
          $stagedLiteExe = Join-Path $artifactDir "CMTrace-Open-Lite_$($env:VERSION)_${{ matrix.artifact_suffix }}.exe"
          Copy-Item (Join-Path $releaseDir "cmtrace-open.exe") $stagedLiteExe -Force

          # NSIS setup installer
          $nsisCandidates = Get-ChildItem -Path $bundleNsisDir -Filter *-setup.exe -File -Recurse
          if ($nsisCandidates.Count -ne 1) {
            $names = ($nsisCandidates | ForEach-Object { $_.FullName }) -join ", "
            throw "Expected exactly one NSIS setup EXE in $bundleNsisDir. Found: $names"
          }
          $stagedNsis = Join-Path $artifactDir "CMTrace-Open_$($env:VERSION)_${{ matrix.artifact_suffix }}-setup.exe"
          Copy-Item $nsisCandidates[0].FullName $stagedNsis -Force

          "full_exe_path=$stagedFullExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "lite_exe_path=$stagedLiteExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "nsis_path=$stagedNsis" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ── Sign all EXEs (standalone full, lite, and NSIS outer installer) ──
      # The signed standalone EXEs are also used by mpdev to build the MSI,
      # so the binaries inside the MSI will carry valid signatures.
      - name: Sign release EXEs
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\release-artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Attest signed EXEs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.exe

      # ── Build MSI via Master Packager Dev (bundles signed full + lite EXEs) ──
      - name: Install Master Packager Dev
        shell: pwsh
        run: |
          $installer = "$env:TEMP\mpdev.msi"
          Invoke-WebRequest -Uri "https://cdn.masterpackager.com/installer/dev/2.1.1/mpdev_self_contained_x64_2.1.1.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait
          "C:\Program Files\Master Packager Ltd\Master Packager Dev" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI with mpdev
        shell: pwsh
        env:
          FULL_EXE_PATH: ${{ steps.stage_artifacts.outputs.full_exe_path }}
          LITE_EXE_PATH: ${{ steps.stage_artifacts.outputs.lite_exe_path }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT_NAME: ${{ secrets.SIGNING_ACCOUNT_NAME }}
          SIGNING_PROFILE_NAME: ${{ secrets.SIGNING_PROFILE_NAME }}
        run: |
          mpdev build src-tauri\installer\package.signed.json `
            --working-dir "${{ github.workspace }}" `
            --properties `
              "$.version=$env:VERSION" `
              "$.outputFileName=CMTrace-Open_$($env:VERSION)_${{ matrix.artifact_suffix }}" `
              "$.platform=${{ matrix.artifact_suffix }}"

      - name: Verify MSI output
        id: verify_msi
        shell: pwsh
        run: |
          $msiPath = Join-Path $PWD "release-artifacts\CMTrace-Open_$($env:VERSION)_${{ matrix.artifact_suffix }}.msi"
          if (-not (Test-Path $msiPath)) {
            throw "Expected MSI not found at $msiPath"
          }
          "msi_path=$msiPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest MSI
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.verify_msi.outputs.msi_path }}

      # ── Generate updater signature for NSIS installer ──
      - name: Generate updater signature for NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NSIS_PATH: ${{ steps.stage_artifacts.outputs.nsis_path }}
        run: |
          npx tauri signer sign "$env:NSIS_PATH"
          $sigPath = "$env:NSIS_PATH.sig"
          if (-not (Test-Path $sigPath)) {
            throw "Updater signature file was not generated at $sigPath"
          }
          Write-Host "Generated updater signature: $sigPath"

      # ── Upload artifacts ──
      - name: Upload signed workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmtrace-open-windows-signed-${{ matrix.artifact_suffix }}-${{ env.VERSION }}
          path: |
            ${{ steps.stage_artifacts.outputs.full_exe_path }}
            ${{ steps.stage_artifacts.outputs.lite_exe_path }}
            ${{ steps.verify_msi.outputs.msi_path }}
            ${{ steps.stage_artifacts.outputs.nsis_path }}
            ${{ steps.stage_artifacts.outputs.nsis_path }}.sig
          if-no-files-found: error

      - name: Publish signed Windows assets to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_EXE_PATH: ${{ steps.stage_artifacts.outputs.full_exe_path }}
          LITE_EXE_PATH: ${{ steps.stage_artifacts.outputs.lite_exe_path }}
          MSI_PATH: ${{ steps.verify_msi.outputs.msi_path }}
          NSIS_PATH: ${{ steps.stage_artifacts.outputs.nsis_path }}
        run: |
          gh release upload $env:TAG_NAME $env:FULL_EXE_PATH $env:LITE_EXE_PATH $env:MSI_PATH $env:NSIS_PATH --clobber

  finalize-updater-manifest:
    name: Finalize updater manifest
    needs:
      - prepare-windows-release
      - windows-signed-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare-windows-release.outputs.version }}
      TAG_NAME: ${{ needs.prepare-windows-release.outputs.tag_name }}

    steps:
      - name: Download signed Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Merge Windows platform entries into latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The x64 and arm64 jobs each used to download, patch, and re-upload
          # latest.json. With nothing having seeded the file the two reads raced
          # and the loser's platform vanished, which is how v1.5.2 shipped with a
          # windows-x86_64 entry and no windows-aarch64 one. Both arches are now
          # merged by a single writer once the matrix has finished.
          # Ask whether the manifest exists before downloading it. Treating any
          # download failure as "no manifest yet" would turn a transient API
          # error into a Windows-only manifest that deletes the macOS and Linux
          # entries, which is the exact failure this job exists to prevent.
          published_assets="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$published_assets" | grep -qx 'latest.json'; then
            gh release download "$TAG_NAME" --pattern latest.json --dir . --clobber
          else
            echo '{}' > latest.json
          fi

          # macOS and Linux entries arrive from cmtrace-release.yml, so anything
          # already in platforms is carried across untouched. Merge onto the
          # existing object rather than rebuilding it so unrecognized top-level
          # metadata survives too.
          jq \
            --arg version "v$VERSION" \
            --arg notes "CMTrace Open v$VERSION" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {
               version: $version,
               notes: $notes,
               pub_date: (.pub_date // $now),
               platforms: (.platforms // {})
             }' latest.json > latest.json.next
          mv latest.json.next latest.json

          for entry in x64:windows-x86_64 arm64:windows-aarch64; do
            suffix="${entry%%:*}"
            platform_key="${entry##*:}"
            installer="CMTrace-Open_${VERSION}_${suffix}-setup.exe"
            signature_path="release-artifacts/${installer}.sig"

            if [ ! -f "$signature_path" ]; then
              echo "::error::Updater signature missing for ${installer}."
              exit 1
            fi

            # The signature is produced on a Windows runner, so strip CR as well
            # as LF before it is embedded in JSON.
            jq \
              --arg key "$platform_key" \
              --arg signature "$(tr -d '\r\n' < "$signature_path")" \
              --arg url "https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${installer}" \
              --arg version "v$VERSION" \
              '.platforms[$key] = {signature: $signature, url: $url, version: $version}' \
              latest.json > latest.json.next
            mv latest.json.next latest.json
          done

          gh release upload "$TAG_NAME" latest.json --clobber

          # cmtrace-release.yml publishes the macOS and Linux entries from a
          # separate workflow run, so a write there can still land between the
          # read above and this upload. tauri-action merges rather than
          # replaces, so the usual outcome is a complete manifest, but read the
          # published file back rather than assuming: a Windows entry that lost
          # the race would otherwise leave those users with no update prompt and
          # nothing in the logs to say so.
          gh release download "$TAG_NAME" --pattern latest.json --dir published --clobber
          missing=""
          for platform_key in windows-x86_64 windows-aarch64; do
            if ! jq -e --arg key "$platform_key" '.platforms | has($key)' published/latest.json > /dev/null; then
              missing="$missing $platform_key"
            fi
          done

          {
            echo "### Updater manifest"
            echo ""
            jq -r '.platforms | keys[] | "- `\(.)`"' published/latest.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$missing" ]; then
            echo "::error::Published latest.json is missing:$missing. A concurrent manifest write clobbered it; re-run this job."
            exit 1
          fi
