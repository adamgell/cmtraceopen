name: 'CMTrace Open: Publish to Chocolatey'

on:
  release:
    types: [published]
  # v1.6.2 backfill/moderation correction only. Future releases use published.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release to submit through the publishing jobs'
        type: choice
        options: [v1.6.2]
        default: v1.6.2
        required: true
      mode:
        description: 'Normal submission or the reviewed, unapproved 1.6.2 metadata correction'
        type: choice
        options: [normal, moderator-correction]
        default: normal
        required: true
      publish:
        description: 'Submit after validation (false checks Windows packing only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: chocolatey-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: >-
      github.repository == 'adamgell/cmtraceopen' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag == 'v1.6.2'))
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      guard_sha256: ${{ steps.pack.outputs.guard_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test package validation
        shell: pwsh
        run: |
          ./scripts/chocolatey-package.test.ps1
          ./scripts/chocolatey-publish.test.ps1
      - name: Fetch published installer and metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw 'Expected stable release tag' }
          $version = $env:RELEASE_TAG.Substring(1)
          gh api "repos/adamgell/cmtraceopen/releases/tags/$env:RELEASE_TAG" > "$env:RUNNER_TEMP/release.json"
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata fetch failed' }
          $release = Get-Content "$env:RUNNER_TEMP/release.json" -Raw | ConvertFrom-Json
          if ($release.tag_name -cne $env:RELEASE_TAG -or $release.draft -ne $false -or $release.prerelease -ne $false) { throw 'Release must be published and stable' }
          if ($env:RELEASE_ID -and [string]$release.id -cne $env:RELEASE_ID) { throw 'Release identity changed' }
          gh release download $env:RELEASE_TAG --repo adamgell/cmtraceopen --pattern "CMTrace-Open_${version}_x64.msi" --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'Release asset download failed' }
      - name: Verify release bytes and pack
        id: pack
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $root = "$env:RUNNER_TEMP/chocolatey-source"
          $validated = ./scripts/prepare-chocolatey-package.ps1 -Tag $env:RELEASE_TAG -OutputDirectory $root -ReleaseMetadataPath "$env:RUNNER_TEMP/release.json" -InstallerPath "$env:RUNNER_TEMP/CMTrace-Open_${version}_x64.msi"
          $output = "$env:RUNNER_TEMP/chocolatey-package"
          New-Item -ItemType Directory -Path $output | Out-Null
          choco pack "$root/cmtraceopen.nuspec" --output-directory $output
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey pack failed' }
          $package = "$output/cmtraceopen.$($validated.Version).nupkg"
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $guard = "$output/chocolatey-submission-guard.ps1"
          Copy-Item scripts/chocolatey-submission-guard.ps1 $guard
          $guardHash = (Get-FileHash $guard -Algorithm SHA256).Hash.ToLowerInvariant()
          "version=$($validated.Version)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "guard_sha256=$guardHash" >> $env:GITHUB_OUTPUT
          "Package: cmtraceopen.$($validated.Version).nupkg; SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chocolatey-package
          path: ${{ runner.temp }}/chocolatey-package/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: >-
      github.repository == 'adamgell/cmtraceopen' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag == 'v1.6.2' && inputs.publish))
    environment: release
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chocolatey-package
          path: package
      - name: Verify package and check existing version
        id: existing
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
          GUARD_SHA256: ${{ needs.package.outputs.guard_sha256 }}
          SUBMISSION_MODE: ${{ inputs.mode || 'normal' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $guard = 'package/chocolatey-submission-guard.ps1'
          if ($env:GUARD_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or (Get-FileHash $guard -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:GUARD_SHA256) { throw 'Submission guard changed after validation' }
          $file = "package/cmtraceopen.$env:PACKAGE_VERSION.nupkg"
          $needsPush = & $guard -PackagePath $file -Version $env:PACKAGE_VERSION -Sha256 $env:PACKAGE_SHA256 -Mode $env:SUBMISSION_MODE -Tag $env:RELEASE_TAG -PublishRequested:($env:PUBLISH_REQUESTED -ceq 'true')
          if ($needsPush -isnot [bool]) { throw 'Invalid submission guard decision' }
          "needs_push=$($needsPush.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $needsPush) { 'Identical package version already exists; no upload needed.' >> $env:GITHUB_STEP_SUMMARY }
      - name: Submit to Chocolatey Community Repository
        if: steps.existing.outputs.needs_push == 'true'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
          GUARD_SHA256: ${{ needs.package.outputs.guard_sha256 }}
          SUBMISSION_MODE: ${{ inputs.mode || 'normal' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) { throw 'Chocolatey publishing credential is not configured' }
          $file = "package/cmtraceopen.$env:PACKAGE_VERSION.nupkg"
          $guard = 'package/chocolatey-submission-guard.ps1'
          if ($env:GUARD_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or (Get-FileHash $guard -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:GUARD_SHA256) { throw 'Submission guard changed before upload' }
          # Re-read server/release state immediately before the ordinary push.
          $needsPush = & $guard -PackagePath $file -Version $env:PACKAGE_VERSION -Sha256 $env:PACKAGE_SHA256 -Mode $env:SUBMISSION_MODE -Tag $env:RELEASE_TAG -PublishRequested:($env:PUBLISH_REQUESTED -ceq 'true')
          if ($needsPush -isnot [bool]) { throw 'Invalid submission guard decision' }
          if (-not $needsPush) { 'Identical package already received; no upload needed.' >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          choco push $file --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey submission failed' }
          'Package submitted; Chocolatey moderation and public availability must be checked separately.' >> $env:GITHUB_STEP_SUMMARY
