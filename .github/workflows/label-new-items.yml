name: Label new issues and PRs

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            if (!item) return;
            const title = item.title || '';

            // Domain/topic labels only, keyed by a regex matched against the title.
            // Change-type labels (feature/test/build/bug) never belong here — they
            // come exclusively from prefixRules/fallbackChangeTypeRules below, so a
            // title can never end up with contradictory labels like bug + feature.
            const topicRules = [
              [/^epic:/i, ['epic']],
              [/\bsccm\b/i, ['sccm', 'parser']],
              [/\bintune\b/i, ['intune', 'parser']],
              [/\bjamf\b/i, ['jamf', 'workspace']],
              [/company portal/i, ['intune', 'portal', 'parser']],
              [/autopilot|\benrollment\b/i, ['enrollment']],
              [/\bdevice inventory\b|windows device|macos device/i, ['device']],
              [/win32 app|store app|platform-script|remediation|package deployment|shell-script execution/i, ['apps']],
              [/build\(macos\)|notarization|developer id signing/i, ['macos']],
              [/restart as administrator|\belevation\b/i, ['windows', 'security']],
            ];

            // Change-type label, keyed off a conventional-commit-style PR title prefix.
            const prefixRules = [
              [/^test\(/i, ['test']],
              [/^feat\(|^feature/i, ['feature']],
              [/^build\(/i, ['build']],
              [/^fix\(/i, ['bug']],
            ];

            // Change-type inference for titles with no conventional-commit prefix
            // (issues rarely use one). Only applied when no prefixRule matched, so
            // an explicit fix(...)/feat(...) prefix always takes precedence.
            const fallbackChangeTypeRules = [
              [/restart as administrator|\belevation\b/i, ['feature']],
            ];

            const labels = new Set(['enhancement']);
            for (const [re, ls] of topicRules) {
              if (re.test(title)) ls.forEach(l => labels.add(l));
            }
            const matchedPrefix = prefixRules.some(([re]) => re.test(title));
            for (const [re, ls] of prefixRules) {
              if (re.test(title)) ls.forEach(l => labels.add(l));
            }
            if (!matchedPrefix) {
              for (const [re, ls] of fallbackChangeTypeRules) {
                if (re.test(title)) ls.forEach(l => labels.add(l));
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              labels: Array.from(labels),
            });
