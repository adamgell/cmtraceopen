name: "CMTrace Open: Release"

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "!*.*.*.*"
  # codesign.yml can be dispatched manually, and its "Create release tag for
  # manual dispatch" step pushes the tag with GITHUB_TOKEN. GitHub suppresses
  # workflow triggers for refs created by GITHUB_TOKEN, so that path publishes
  # Windows artifacts without ever firing the tag push this workflow listens
  # for, and the release ships Windows-only (v1.5.2). Dispatch lets the macOS
  # and Linux half be run against a tag that already exists.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build macOS and Linux artifacts for (for example 1.5.2 or v1.5.2). The tag must already exist.
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Release (${{ matrix.label }})
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Both matrix entries resolve these from the same inputs, so the usual
    # last-writer-wins caveat on matrix outputs does not apply here.
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    environment: codesigning
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            tag_name="v$version"
          else
            # The tag filters accept both "v1.5.2" and "1.5.2", so the pushed tag
            # is authoritative and only the version string gets normalized.
            tag_name="$REF_NAME"
            version="${REF_NAME#v}"
          fi

          # Without this a tag like v1.6.0-rc.1 would build, publish with
          # prerelease: false, and overwrite the stable updater manifest that
          # every installed copy polls.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Expected a stable MAJOR.MINOR.PATCH version, got '$version'. This workflow publishes stable releases only."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Wait for exact draft release
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Windows preparation is the sole draft creator and may wait two
          # minutes first. Retry only an absent tag, before setup or signing.
          for attempt in $(seq 1 24); do
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/unix-release-pages.json"
            jq --arg tag "$TAG_NAME" '[.[][] | select(.tag_name == $tag)]' \
              "$RUNNER_TEMP/unix-release-pages.json" > "$RUNNER_TEMP/unix-release-preflight.json"
            count="$(jq 'length' "$RUNNER_TEMP/unix-release-preflight.json")"
            if [ "$count" -eq 1 ]; then
              jq -e --arg tag "$TAG_NAME" '.[0] |
                .tag_name == $tag and .draft == true and .prerelease == false and
                (.id | type == "number" and . > 0 and floor == .)
              ' "$RUNNER_TEMP/unix-release-preflight.json" > /dev/null
              break
            fi
            if [ "$count" -ne 0 ] || [ "$attempt" -eq 24 ]; then
              echo "::error::Expected one existing draft release for the exact tag; Unix will not create it."
              exit 1
            fi
            sleep 10
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a dispatch the workflow ref is a branch, so the tag has to be
          # named explicitly or the build would package the wrong commit.
          ref: refs/tags/${{ steps.resolve.outputs.tag_name }}

      - name: Resolve release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          # tauri-action calls updateRelease on a published release with whatever
          # body it is handed, so a re-run against an existing release would
          # replace hand-written notes with the template. Read the published body
          # back and feed it straight through instead.
          draft=""
          if gh release view "$TAG_NAME" --json body,isDraft > release-state.json 2>/dev/null; then
            jq -r '.body // ""' release-state.json > release-notes.md
            draft="$(jq -r '.isDraft' release-state.json)"
          fi

          if [ ! -s release-notes.md ]; then
            template=".github/release-notes/template.md"
            if [ ! -f "$template" ]; then
              echo "::error::No release notes exist for $TAG_NAME and $template is missing from that tag."
              exit 1
            fi
            sed -e "s|{{TAG}}|$TAG_NAME|g" -e "s|{{VERSION}}|$VERSION|g" "$template" > release-notes.md
          fi

          # tauri-action finds a draft by scanning the release list but a published
          # one by tag lookup. The wrong flag sends it down the create path for a
          # tag that already exists, which the API rejects.
          if [ -z "$draft" ]; then
            draft="true"
          fi

          echo "draft=$draft" >> "$GITHUB_OUTPUT"

          # The closing delimiter has to start its own line, but normalizing the
          # body itself would edit the notes on the way back to the release, so
          # only add the newline when one is genuinely missing.
          if [ -n "$(tail -c 1 release-notes.md)" ]; then
            printf '\n' >> release-notes.md
          fi

          {
            echo "body<<CMTRACE_RELEASE_BODY_EOF"
            cat release-notes.md
            echo "CMTRACE_RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Resolve Apple signing identity
        if: runner.os == 'macOS'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" \
            | head -1 \
            | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libc6 libstdc++6 \
            squashfs-tools python3-venv python3-apt

      - name: Install pinned AppImage inspection tools
        if: runner.os == 'Linux'
        run: |
          /usr/bin/python3 -m venv --system-site-packages .appimage-abi-venv
          .appimage-abi-venv/bin/python -m pip install --ignore-installed --require-hashes --only-binary=:all: -r scripts/appimage-abi-requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate Rust SBOM
        working-directory: src-tauri
        run: |
          cargo cyclonedx --format json --override-filename sbom-rust
          mv sbom-rust.json ../sbom-rust.cdx.json

      - name: Generate npm SBOM
        run: npm sbom --sbom-format cyclonedx > sbom-npm.cdx.json

      - name: Remove cached bundle outputs
        if: runner.os == 'Linux'
        env:
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
        run: node scripts/ci-bundle-outputs.mjs clean

      - name: Build and create release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          CMTRACE_APPIMAGE_VERIFY_ROOT: ${{ runner.os == 'Linux' && 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          args: --target ${{ matrix.target }}
          # Without a tagName/releaseId the pinned action only builds locally.
          # Upload happens after trust/ABI evidence and attestations succeed.
          uploadUpdaterJson: false

      - name: Upload AppImage inspection evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage-abi-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/provenance/appimage-abi.json
          if-no-files-found: error

      - name: Set up Python for macOS trust verification
        if: runner.os == 'macOS'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Tauri CLI 2.11.5 notarizes/staples the app, but its DMG bundler
      # only signs the enclosing disk image. Finish that distinct artifact
      # before trust receipts, hashes, attestations or release uploads.
      - name: Notarize and staple final macOS DMG
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
          NOTARY_RECEIPTS: release-verification/notarization
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          root = Path(os.environ['NOTARY_RECEIPTS'])
          root.mkdir(parents=True, exist_ok=False)
          state = {'status': 'FAIL', 'runId': os.environ['GITHUB_RUN_ID'],
                   'runAttempt': os.environ['GITHUB_RUN_ATTEMPT']}
          def record(name, data):
              with (root / name).open('x') as stream:
                  json.dump(data, stream, indent=2)
                  stream.flush()
                  os.fsync(stream.fileno())
          def require(condition):
              if not condition: raise ValueError('Notarization checkpoint failed')
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          def command(args, timeout):
              # Arguments may include Apple credentials. Never print commands,
              # raw output or subprocess exception objects into logs/receipts.
              env = {k:v for k,v in os.environ.items() if k not in
                     ('APPLE_ID','APPLE_PASSWORD','APPLE_TEAM_ID','GH_TOKEN','GITHUB_TOKEN')}
              result = subprocess.run(args, capture_output=True, text=True, timeout=timeout, env=env)
              require(result.returncode == 0)
              return result
          try:
              require(os.environ['GITHUB_RUN_ATTEMPT'] == '1')
              auth = [os.environ.get(k, '') for k in ('APPLE_ID','APPLE_PASSWORD','APPLE_TEAM_ID')]
              require(all(auth) and auth[2] == 'CRHL85PH9Y')
              candidates = list((Path(os.environ['BUNDLE_ROOT']) / 'dmg').glob('*.dmg'))
              require(len(candidates) == 1 and candidates[0].is_file() and not candidates[0].is_symlink())
              dmg = candidates[0]
              command(['codesign','--verify','--strict',str(dmg)], 45)
              details = command(['codesign','--display','--verbose=4',str(dmg)], 45)
              require('TeamIdentifier=CRHL85PH9Y' in (details.stdout + details.stderr).splitlines())
              state['submittedSha256'] = digest(dmg)
              record('submission-intent.json', dict(state, path=str(dmg),
                     warning='Submission may have begun; never automatically resubmit'))
              credentials = ['--apple-id',auth[0],'--password',auth[1],'--team-id',auth[2]]
              response = command(['xcrun','notarytool','submit',str(dmg),*credentials,
                                  '--no-wait','--output-format','json'], 120)
              sid = json.loads(response.stdout).get('id')
              require(isinstance(sid,str) and re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}',sid))
              state['submissionId'] = sid
              record('submission.json', dict(state))
              print('Apple DMG submission ID: ' + sid, flush=True)
              response = command(['xcrun','notarytool','wait',sid,*credentials,
                                  '--timeout','8m','--output-format','json'], 510)
              result = json.loads(response.stdout)
              require(result.get('id') == sid and result.get('status') == 'Accepted')
              state['appleStatus'] = 'Accepted'
              record('accepted.json', dict(state))
              require(digest(dmg) == state['submittedSha256'])
              command(['xcrun','stapler','staple',str(dmg)], 60)
              command(['xcrun','stapler','validate',str(dmg)], 60)
              state['stapledSha256'] = digest(dmg)
              state['status'] = 'PASS'
          except (ValueError, KeyError, TypeError, OSError, subprocess.SubprocessError):
              print('DMG notarization/stapling incomplete; inspect retained checkpoints. Do not resubmit automatically.', file=sys.stderr)
              sys.exit(1)
          finally:
              record('result.json', state)
          PY

      - name: Retain macOS DMG notarization checkpoints
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-verification/notarization
          if-no-files-found: error
          retention-days: 90

      - name: Verify macOS release trust and payload identity
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          python3 scripts/verify-macos-release.py \
            --bundle "src-tauri/target/${{ matrix.target }}/release/bundle" \
            --receipts release-verification/macos --version "$VERSION"

      - name: Retain macOS trust verification receipts
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-trust-${{ steps.resolve.outputs.tag_name }}
          path: release-verification/macos
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage

      - name: Upload verified release bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release-assets
          # Canonical release names match UPDATER_TARGETS. Stage verified bytes
          # without modifying the bundle or its retained provenance paths.
          stage_bundle() {
            local destination="$1" signed="$2"
            shift 2
            if [ "$#" -ne 1 ] || [ ! -f "$1" ] || [ -L "$1" ]; then
              echo "::error::Expected exactly one regular bundle for $destination"
              exit 1
            fi
            cp "$1" "release-assets/$destination"
            cmp -s "$1" "release-assets/$destination"
            if [ "$RUNNER_OS" = macOS ]; then
              local expected actual
              expected="$(jq -er --arg path "$1" '
                [.artifacts[] | select(.path == $path)] |
                if length == 1 then .[0].sha256 else error("Missing verified artifact") end
              ' release-verification/macos/macos-trust.json)"
              actual="$(shasum -a 256 "release-assets/$destination" | cut -d ' ' -f 1)"
              test "$actual" = "$expected"
            fi
            if [ "$signed" = yes ]; then
              test -f "$1.sig" && test ! -L "$1.sig"
              cp "$1.sig" "release-assets/$destination.sig"
              cmp -s "$1.sig" "release-assets/$destination.sig"
            fi
          }
          case "$RUNNER_OS" in
            macOS)
              jq -e --arg version "$VERSION" --arg source "$(git rev-parse HEAD)" '
                .status == "PASS" and .version == $version and .sourceCommit == $source
              ' release-verification/macos/macos-trust.json > /dev/null
              stage_bundle "CMTrace.Open_${VERSION}_aarch64.dmg" no "$BUNDLE_ROOT/dmg/"*.dmg
              stage_bundle "CMTrace.Open_${VERSION}_aarch64.app.tar.gz" yes "$BUNDLE_ROOT/macos/"*.app.tar.gz
              cp release-verification/macos/macos-trust.json "release-assets/macos-trust-${VERSION}.json"
              ;;
            Linux)
              stage_bundle "CMTrace.Open_${VERSION}_amd64.AppImage" yes "$BUNDLE_ROOT/appimage/"*.AppImage
              stage_bundle "CMTrace.Open_${VERSION}_amd64.deb" yes "$BUNDLE_ROOT/deb/"*.deb
              stage_bundle "CMTrace.Open-${VERSION}-1.x86_64.rpm" yes "$BUNDLE_ROOT/rpm/"*.rpm
              cp "$BUNDLE_ROOT/provenance/appimage-abi.json" "release-assets/appimage-abi-${VERSION}.json"
              ;;
            *) echo "::error::Unexpected release platform"; exit 1 ;;
          esac
          # Windows preparation owns draft creation; never publish or recreate
          # a release here. gh release view/upload both support existing drafts.
          actual_tag="$(gh release view "$TAG_NAME" --json tagName --jq '.tagName')"
          test "$actual_tag" = "$TAG_NAME"
          gh release upload "$TAG_NAME" release-assets/* --clobber

      - name: Upload SBOMs to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            sbom-rust.cdx.json \
            sbom-npm.cdx.json \
            --clobber

  # Publish the CLI as a separate asset after the app release succeeds. A failure
  # here fails this job/workflow but does not roll back the published app assets.
  publish-event-log-export:
    name: Publish exporter (${{ matrix.label }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            exe: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
            exe: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            exe: ""

    steps:
      # Build from the tag the release was cut from, not from the branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.release.outputs.tag_name }}

      # The binary uses app_lib, which still depends on Tauri and its native libraries.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.target }}

      # Direct Cargo does not run beforeBuildCommand or enable custom-protocol.
      # With devUrl configured, generate_context! does not embed frontend assets.
      - name: Build
        working-directory: src-tauri
        run: cargo build --locked --release --target ${{ matrix.target }} --no-default-features --features event-log --bin event-log-export

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="event-log-export-${{ needs.release.outputs.version }}-${{ matrix.target }}${{ matrix.exe }}"
          cp "src-tauri/target/${{ matrix.target }}/release/event-log-export${{ matrix.exe }}" "$asset"
          gh release upload "${{ needs.release.outputs.tag_name }}" "$asset" --clobber

  publish-updater-manifest:
    name: Publish updater manifest
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    # Shared with codesign.yml; see the note there for why grouping publisher
    # jobs is safe when grouping build jobs would not be.
    concurrency:
      group: updater-manifest-${{ needs.release.outputs.tag_name }}
      cancel-in-progress: false

    steps:
      # A local `uses:` path is resolved from the workspace, so the calling job
      # must check the repository out before it can name this action at all.
      # Without this step the job dies with "Can't find 'action.yml'".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish updater manifest
        uses: ./.github/actions/publish-updater-manifest
        with:
          version: ${{ needs.release.outputs.version }}
          tag-name: ${{ needs.release.outputs.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
