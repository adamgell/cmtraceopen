name: "CMTrace Open: Publish to Scoop bucket"

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.5.2)"
        required: true

permissions: {}

concurrency:
  group: scoop-publish
  cancel-in-progress: false

jobs:
  scoop:
    name: Update Scoop bucket
    # windows-latest so the bumped manifests are validated by real Scoop before
    # they are committed. A bad hash then fails the release job instead of every
    # user's 'scoop install'.
    runs-on: windows-latest
    permissions:
      contents: write
      # The bucket bump lands as a pull request rather than a direct push to the
      # default branch, which the Protect ruleset rejects for GITHUB_TOKEN.
      pull-requests: write
      # Kicking the required checks needs workflow_dispatch, because a pull
      # request opened with GITHUB_TOKEN does not trigger workflows by itself.
      actions: write
    steps:
      # The release event checks out the tag, which cannot be pushed to, and the
      # commit belongs on the default branch either way. Keep the write token
      # unavailable to validation steps and expose it only to the final push.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Derive version
        id: release
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The script derives every URL from the manifests' own autoupdate
      # templates, so this repo's bucket and Scoop's Excavator bot cannot drift
      # apart on where the assets live. It throws on any problem, and
      # $ErrorActionPreference is 'stop' in pwsh steps, so there is no exit code
      # to test here (unlike the native komac calls in the winget job).
      - name: Update manifests
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./.github/scripts/Update-ScoopManifest.ps1 -Version $env:VERSION
          git --no-pager diff -- bucket
          exit 0

      - name: Install Scoop
        shell: pwsh
        run: |
          # `get.scoop.sh` redirects to `master`, so the script this runs was chosen
          # by whoever last pushed. The commit is pinned and the content verified.
          $scoopInstallerUrl = "https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1"
          $scoopInstallerSha256 = "94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512"
          Invoke-WebRequest -Uri $scoopInstallerUrl -OutFile install-scoop.ps1
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath install-scoop.ps1).Hash.ToLowerInvariant()
          if ($actual -ne $scoopInstallerSha256) {
            Remove-Item -LiteralPath install-scoop.ps1 -Force -ErrorAction SilentlyContinue
            throw "Scoop installer digest mismatch: expected $scoopInstallerSha256, got $actual"
          }
          # GitHub runners execute as a local administrator, which the installer
          # refuses without this switch.
          ./install-scoop.ps1 -RunAsAdmin
          Remove-Item install-scoop.ps1 -Force

          $shims = "$env:USERPROFILE\scoop\shims"
          if (-not (Test-Path -LiteralPath $shims)) { throw "Scoop install created no shim directory at $shims" }
          # The installer only updates the PATH of future sessions.
          $shims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          exit 0

      # Verifies the hashes, the download URLs and the shim/shortcut wiring on
      # the x64 runner. arm64 URLs are only checked for existence, by the
      # manifest updater.
      - name: Validate manifests with Scoop
        shell: pwsh
        run: |
          # Asserted on observable state rather than on $LASTEXITCODE: 'scoop' is
          # a shim, so which of scoop.cmd/scoop.ps1 gets resolved decides whether
          # an exit code is set at all. A missing shim is the unambiguous signal
          # that the install did not complete.
          foreach ($manifest in Get-ChildItem ./bucket -Filter '*.json' -File) {
            $app = $manifest.BaseName
            $shim = "$env:USERPROFILE\scoop\shims\$app.exe"

            Write-Host "::group::scoop install $app"
            scoop install $manifest.FullName
            Write-Host "::endgroup::"
            if (-not (Test-Path -LiteralPath $shim)) {
              throw "scoop install $app produced no shim at $shim (hash mismatch or bad manifest)"
            }

            Write-Host "::group::scoop uninstall $app"
            scoop uninstall $app
            Write-Host "::endgroup::"
            if (Test-Path -LiteralPath $shim) { throw "scoop uninstall $app left a shim at $shim" }
          }
          exit 0

      - name: Commit manifest updates
        id: commit
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket

          # Exit code 1 means there is something staged, which is the normal path.
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "bucket/ is already at $env:VERSION; nothing to commit"
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          git commit -m "chore(scoop): bump bucket to $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }

          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Push the bucket branch
        if: steps.commit.outputs.changed == 'true'
        id: branch
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git

          $branch = "scoop/bucket-$env:VERSION"
          git switch -c $branch

          # A re-run for the same version republishes a corrected bucket, so the
          # branch is replaced rather than appended to. It is a bot branch with no
          # other writers, and the Protect ruleset targets only the default branch.
          git push --force origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }

          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # `main` is protected: a direct push from here was rejected with GH013
      # ("6 of 6 required status checks are expected", "Commits must have verified
      # signatures"), and a runner-made commit cannot be signed. The bucket bump
      # therefore arrives as a pull request, which a maintainer merges.
      - name: Open the pull request
        if: steps.commit.outputs.changed == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $existing = gh pr list --head $env:BRANCH --state open --json number --jq '.[0].number'
          if ($LASTEXITCODE -ne 0) { throw "gh pr list failed with exit code $LASTEXITCODE" }

          if ($existing) {
            Write-Host "Pull request #$existing already tracks $env:BRANCH; the pushed commit updates it."
            exit 0
          }

          $body = @(
            'Points the checked-in Scoop manifests in `bucket/` at ' + $env:TAG_NAME + '.'
            ''
            'The release event ran `.github/scripts/Update-ScoopManifest.ps1`, then installed and uninstalled both manifests with real Scoop on a Windows runner, so the hashes, the download URLs and the shim wiring are validated before this lands.'
            ''
            'It arrives as a pull request because the default branch is protected: the previous shape pushed with `GITHUB_TOKEN` and was rejected by the Protect ruleset with `GH013` (required status checks, and required signatures that a runner-made commit cannot carry).'
            ''
            'The required checks are kicked against this branch explicitly, because a pull request opened with `GITHUB_TOKEN` does not start workflows on its own.'
          ) -join "`n"

          $created = gh pr create --base $env:DEFAULT_BRANCH --head $env:BRANCH `
            --title "chore(scoop): bump bucket to $env:VERSION" `
            --body $body 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host $created
            exit 0
          }

          $detail = $created -join "`n"
          # GITHUB_TOKEN may only open pull requests when the repository allows it.
          # Without this check the job dies on a GraphQL error that says nothing
          # about the setting a maintainer has to change.
          if ($detail -match 'not permitted to create or approve pull requests') {
            $hint = @(
              "gh pr create was refused: this repository does not allow GitHub Actions to open pull requests,"
              "so the branch $env:BRANCH is pushed and correct but has no pull request."
              ""
              "Enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests', or give this job a token that may open one."
              ""
              "Original error: $detail"
            ) -join "`n"
            throw $hint
          }

          throw "gh pr create failed: $detail"

      # GitHub suppresses workflow runs for events created by GITHUB_TOKEN, so the
      # pull request opened above starts no checks and the required status checks
      # would never report. `workflow_dispatch` is the documented exception that
      # still creates a run, so the same CI is started against the branch.
      - name: Kick the checks
        if: steps.commit.outputs.changed == 'true'
        shell: pwsh
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cmtrace-ci.yml --ref $env:BRANCH
          if ($LASTEXITCODE -ne 0) { throw "gh workflow run failed with exit code $LASTEXITCODE" }
