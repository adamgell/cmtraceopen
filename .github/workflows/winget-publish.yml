name: "CMTrace Open: Publish to winget"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process (e.g. v1.5.2)"
        required: true
      submit:
        description: "Submit manifests to microsoft/winget-pkgs"
        type: boolean
        default: true
      diagnostic_only:
        description: "Read credential/fork metadata only; never generate or submit manifests"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: winget-publish
  cancel-in-progress: false

jobs:
  winget:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only }}
    name: Update winget package
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rehearsals still generate manifests. Publication skips versions already
      # merged upstream, including versions submitted by another contributor.
      - name: Check existing winget version
        if: github.event_name == 'release' || inputs.submit
        id: publication
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/winget_publication_guard.py

      - name: Install komac
        if: steps.publication.outputs.already_published != 'true'
        shell: pwsh
        run: |
          # Pinned rather than following `latest`, which let the publisher choose the
          # tool version at run time. The digest is the one that release publishes.
          $komacVersion = "2.16.0"
          $komacAsset = "komac-$komacVersion-x86_64-pc-windows-msvc.exe"
          $komacSha256 = "bdc45baf028f750da7519cc8a5f2eab5dfef46dfe88650eeb0d0a9bf51446e4f"
          $komacUrl = "https://github.com/russellbanks/Komac/releases/download/v$komacVersion/$komacAsset"
          Write-Host "Downloading $komacAsset"
          Invoke-WebRequest -Uri $komacUrl -OutFile komac.exe
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath komac.exe).Hash.ToLowerInvariant()
          if ($actual -ne $komacSha256) {
            Remove-Item -LiteralPath komac.exe -Force -ErrorAction SilentlyContinue
            throw "Komac $komacVersion digest mismatch: expected $komacSha256, got $actual"
          }
          $komacDir = "$env:RUNNER_TEMP\komac"
          New-Item -ItemType Directory -Path $komacDir -Force | Out-Null
          Move-Item -Path .\komac.exe -Destination "$komacDir\komac.exe"
          $komacDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Derive version and URLs
        if: steps.publication.outputs.already_published != 'true'
        id: release
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG_NAME"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "url_x64_exe=$base/CMTrace-Open_${version}_x64.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "url_arm64_exe=$base/CMTrace-Open_${version}_arm64.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "url_x64_msi=$base/CMTrace-Open_${version}_x64.msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "url_arm64_msi=$base/CMTrace-Open_${version}_arm64.msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Generated locally rather than submitted directly, so the locale metadata
      # komac cannot manage (see .github/winget/locale-metadata.yaml) can be
      # applied before the pull request is opened.
      - name: Generate manifests
        if: steps.publication.outputs.already_published != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'winget-manifests'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          komac update AdamGell.CMTraceOpen `
            --version ${{ steps.release.outputs.version }} `
            --urls ${{ steps.release.outputs.url_x64_exe }} `
                   ${{ steps.release.outputs.url_arm64_exe }} `
                   ${{ steps.release.outputs.url_x64_msi }} `
                   ${{ steps.release.outputs.url_arm64_msi }} `
            --dry-run `
            --output $out
          if ($LASTEXITCODE -ne 0) { throw "komac update failed with exit code $LASTEXITCODE" }

          Write-Host "Generated manifests:"
          Get-ChildItem -Path $out -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName)" }

          "output_dir=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: generate

      - name: Apply locale metadata
        if: steps.publication.outputs.already_published != 'true'
        shell: pwsh
        run: |
          ./.github/scripts/Set-WingetLocaleMetadata.ps1 `
            -ManifestDirectory "${{ steps.generate.outputs.output_dir }}" `
            -MetadataPath ./.github/winget/locale-metadata.yaml

      # The patched manifest is echoed so a workflow_dispatch run is a complete
      # rehearsal: it proves komac's --output-directory layout, the patch script,
      # and the resulting manifest are all correct without touching winget-pkgs.
      - name: Show patched manifest
        if: steps.publication.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path "${{ steps.generate.outputs.output_dir }}" -Recurse -Filter '*.locale.en-US.yaml' -File |
            Select-Object -First 1
          if (-not $manifest) { throw "No locale manifest found after patching" }

          Write-Host "::group::$($manifest.Name)"
          Get-Content -LiteralPath $manifest.FullName -Raw | Write-Host
          Write-Host "::endgroup::"

      # Release events submit automatically. Manual runs submit by default and
      # can opt into a rehearsal with submit=false.
      - name: Submit to winget-pkgs
        if: (github.event_name == 'release' || inputs.submit) && steps.publication.outputs.already_published != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          # Submit the directory that actually holds the manifests, so the layout
          # komac chose under --output-directory does not have to be hardcoded.
          $manifest = Get-ChildItem -Path "${{ steps.generate.outputs.output_dir }}" -Recurse -Filter '*.locale.en-US.yaml' -File |
            Select-Object -First 1
          if (-not $manifest) { throw "No locale manifest found to submit" }

          komac submit $manifest.Directory.FullName --yes
          if ($LASTEXITCODE -ne 0) { throw "komac submit failed with exit code $LASTEXITCODE" }

  diagnose-access:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only }}
    name: Diagnose winget access (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read authenticated identity and fork permissions
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
        run: python3 .github/scripts/winget_access_diagnostic.py
