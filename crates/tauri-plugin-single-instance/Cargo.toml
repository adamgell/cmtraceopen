[package]
publish = false
edition = "2021"
rust-version = "1.89"
name = "tauri-plugin-single-instance"
version = "2.4.5+cmtraceopen.1"
authors = ["Tauri Programme within The Commons Conservancy"]
build = false
exclude = [
    "/banner.png",
    "/examples",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Ensure a single instance of your tauri app is running."
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tauri-apps/plugins-workspace"

[package.metadata.platforms.support.windows]
level = "full"
notes = ""

[package.metadata.platforms.support.linux]
level = "full"
notes = ""

[package.metadata.platforms.support.macos]
level = "full"
notes = ""

[package.metadata.platforms.support.android]
level = "none"
notes = ""

[package.metadata.platforms.support.ios]
level = "none"
notes = ""

[features]
deep-link = ["dep:tauri-plugin-deep-link"]
semver = ["dep:semver"]

[lib]
name = "tauri_plugin_single_instance"
path = "src/lib.rs"

[dependencies.semver]
version = "1"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.tauri]
version = "2.10"
default-features = false

[dependencies.tauri-plugin-deep-link]
version = "=2.4.10"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["net"]

[dependencies.tracing]
version = "0.1"

[target.'cfg(target_os = "linux")'.dependencies.zbus]
version = "=6.0.0"
default-features = false
features = ["tokio", "proxy", "service"]

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.60"
features = [
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
]

# Real private-session D-Bus tests also run on macOS; they exercise the Linux
# transport independently of Tauri and do not substitute for Linux acceptance.
[target.'cfg(unix)'.dev-dependencies.zbus]
version = "=6.0.0"
default-features = false
features = ["tokio", "proxy", "service"]

[dev-dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "time", "sync"]

[[test]]
name = "linux_dbus"
path = "tests/linux_dbus.rs"
